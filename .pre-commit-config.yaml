repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy with Pydantic plugin
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
