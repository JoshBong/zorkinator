<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B3A4A"/>
    </marker>
    <style>
      .t { font-weight: 700; text-anchor: middle; }
      .s { font-size: 13.5px; text-anchor: middle; }
      .ln { stroke: #2B3A4A; stroke-width: 2.2; fill: none; marker-end: url(#a); }
      .lbl { font-size: 13px; fill: #2B3A4A; }
      .llm { fill: #F8E6CB; stroke: #C27C1E; stroke-width: 2.5; }
      .llm-t { fill: #9A5A0C; font-size: 19px; }
      .llm-s { fill: #9A5A0C; }
      .code { fill: #E3EFD9; stroke: #5A8A3A; stroke-width: 2.5; }
      .code-t { fill: #3F6B25; font-size: 19px; }
      .code-s { fill: #3F6B25; }
      .env { fill: #E4ECF5; stroke: #4A6E93; stroke-width: 2.5; }
      .env-t { fill: #2F5275; font-size: 19px; }
      .env-s { fill: #2F5275; }
      .plain { fill: #FFFFFF; stroke: #555; stroke-width: 2.2; }
      .plain-t { fill: #444; font-size: 19px; }
      .plain-s { fill: #444; }
    </style>
  </defs>

  <rect width="1240" height="640" fill="#FFFFFF"/>

  <!-- panels -->
  <rect x="250" y="18" width="745" height="365" rx="30" fill="#F3F6FA" stroke="#C9D6E3" stroke-width="1.5"/>
  <text x="272" y="370" font-weight="700" font-size="16" fill="#1E2A36">Inner loop · every move of one game</text>
  <rect x="250" y="405" width="745" height="185" rx="30" fill="#FBF7F0" stroke="#E6D8C2" stroke-width="1.5"/>
  <text x="272" y="578" font-weight="700" font-size="16" fill="#1E2A36">Outer loop · between games</text>

  <!-- left column -->
  <rect x="18" y="40" width="205" height="120" rx="14" class="plain"/>
  <text x="120" y="72" class="t plain-t">Problem</text>
  <text class="s plain-s"><tspan x="120" y="98">LLMs don't learn from</tspan><tspan x="120" y="116">their own experience</tspan><tspan x="120" y="136">(paper: under 10% of Zork)</tspan></text>

  <rect x="18" y="190" width="205" height="135" rx="14" class="plain"/>
  <text x="120" y="222" class="t plain-t">Ground rules</text>
  <text class="s plain-s"><tspan x="120" y="248">Human-visible text only</tspan><tspan x="120" y="268">No save / restore</tspan><tspan x="120" y="288">Cold start: no hints,</tspan><tspan x="120" y="306">no walkthrough</tspan></text>

  <path d="M223,100 L262,100 L262,180 L290,180" class="ln"/>
  <path d="M223,258 L262,258 L262,222 L290,222" class="ln"/>

  <!-- inner loop boxes -->
  <rect x="292" y="148" width="190" height="105" rx="14" class="code"/>
  <text x="387" y="180" class="t code-t">Builder</text>
  <text class="s code-s"><tspan x="387" y="205">Fresh prompt: state, cautions,</tspan><tspan x="387" y="224">open leads. When stalled:</tspan><tspan x="387" y="242">pursue a lead or try new</tspan></text>

  <rect x="505" y="36" width="205" height="105" rx="14" class="llm"/>
  <text x="607" y="68" class="t llm-t">Player LLM</text>
  <text class="s llm-s"><tspan x="607" y="93">Command + current goal</tspan><tspan x="607" y="112">+ what it expects</tspan><tspan x="607" y="130">to happen</tspan></text>

  <rect x="750" y="36" width="215" height="105" rx="14" class="code"/>
  <text x="857" y="68" class="t code-t">Verifier</text>
  <text class="s code-s"><tspan x="857" y="93">Hard rules block;</tspan><tspan x="857" y="112">soft rules are cautions.</tspan><tspan x="857" y="130">No LLM involved</tspan></text>

  <rect x="760" y="208" width="200" height="100" rx="14" class="env"/>
  <text x="860" y="240" class="t env-t">Zork I (Jericho)</text>
  <text class="s env-s"><tspan x="860" y="265">Runs the command,</tspan><tspan x="860" y="284">returns game text</tspan></text>

  <rect x="520" y="240" width="200" height="105" rx="14" class="code"/>
  <text x="620" y="272" class="t code-t">Scribe</text>
  <text class="s code-s"><tspan x="620" y="297">Updates map, items, tried;</tspan><tspan x="620" y="316">confirms or contradicts</tspan><tspan x="620" y="334">memories; flags surprises</tspan></text>

  <!-- inner loop arrows -->
  <path d="M430,148 L505,100" class="ln"/>
  <path d="M710,88 L748,88" class="ln"/>
  <path d="M857,141 L857,206" class="ln"/>
  <path d="M760,275 L722,288" class="ln"/>
  <path d="M520,292 L484,240" class="ln"/>
  <path d="M800,141 C790,172 700,172 680,143" class="ln"/>
  <text x="742" y="186" class="lbl" text-anchor="middle">blocked: try again</text>

  <!-- inner loop icon -->
  <g transform="translate(590,196) scale(0.8)">
    <path d="M-20,-4 A20,20 0 0 1 16,-12" stroke="#1E2A36" stroke-width="5" fill="none" marker-end="url(#a)"/>
    <path d="M20,4 A20,20 0 0 1 -16,12" stroke="#1E2A36" stroke-width="5" fill="none" marker-end="url(#a)"/>
  </g>

  <!-- outer loop boxes (flow right to left) -->
  <rect x="800" y="428" width="175" height="115" rx="14" class="env"/>
  <text x="887" y="458" class="t env-t">MongoDB Atlas</text>
  <text class="s env-s"><tspan x="887" y="483">moves · world facts · map</tspan><tspan x="887" y="502">memories · leads · rules</tspan><tspan x="887" y="521">harness versions</tspan></text>

  <rect x="610" y="428" width="170" height="115" rx="14" class="llm"/>
  <text x="695" y="458" class="t llm-t">Reflector</text>
  <text class="s llm-s"><tspan x="695" y="483">Reads deaths, surprises;</tspan><tspan x="695" y="502">proposes memories and</tspan><tspan x="695" y="521">the frontier (leads)</tspan></text>

  <rect x="430" y="428" width="160" height="115" rx="14" class="code"/>
  <text x="510" y="458" class="t code-t">Versions</text>
  <text class="s code-s"><tspan x="510" y="483">Checks every cited</tspan><tspan x="510" y="502">move; commits all</tspan><tspan x="510" y="521">or nothing</tspan></text>

  <rect x="268" y="428" width="145" height="115" rx="14" class="code"/>
  <text x="340" y="458" class="t code-t">Promoter</text>
  <text class="s code-s"><tspan x="340" y="483">Rule → hard only</tspan><tspan x="340" y="502">if a replay proves</tspan><tspan x="340" y="521">it prevents a death</tspan></text>

  <path d="M680,345 C700,390 850,380 875,426" class="ln"/>
  <text x="898" y="396" class="lbl">every move + evidence</text>
  <path d="M800,485 L782,485" class="ln"/>
  <path d="M610,485 L592,485" class="ln"/>
  <path d="M430,485 L415,485" class="ln"/>

  <!-- next version back into the inner loop -->
  <path d="M340,428 L340,255" class="ln"/>
  <text x="350" y="399" class="lbl">next game plays the exact version v(N+1)</text>
  <g transform="translate(146,480)">
    <path d="M-22,-4 A22,22 0 0 1 18,-13" stroke="#1E2A36" stroke-width="5.5" fill="none" marker-end="url(#a)"/>
    <path d="M22,4 A22,22 0 0 1 -18,13" stroke="#1E2A36" stroke-width="5.5" fill="none" marker-end="url(#a)"/>
  </g>
  <text x="146" y="525" class="t" font-size="18" fill="#1E2A36">Learns across</text>
  <text x="146" y="546" class="t" font-size="18" fill="#1E2A36">games</text>

  <!-- right column -->
  <path d="M995,200 L1030,200" class="ln"/>
  <rect x="1032" y="130" width="192" height="140" rx="14" class="plain"/>
  <text x="1128" y="162" class="t plain-t">Measured</text>
  <text class="s plain-s"><tspan x="1128" y="188">Score (never trained on)</tspan><tspan x="1128" y="208">Surprise rate per game</tspan><tspan x="1128" y="228">vs. the paper and our</tspan><tspan x="1128" y="246">100-game baseline</tspan></text>

  <!-- legend -->
  <g font-size="13" fill="#333">
    <rect x="1032" y="440" width="18" height="14" rx="3" class="llm"/><text x="1058" y="452">LLM call</text>
    <rect x="1032" y="466" width="18" height="14" rx="3" class="code"/><text x="1058" y="478">Fixed code</text>
    <rect x="1032" y="492" width="18" height="14" rx="3" class="env"/><text x="1058" y="504">Game / storage</text>
  </g>

  <text x="622" y="624" class="t" font-size="18" fill="#1E2A36">Zorkinator: a harness that learns how the world works from consequences</text>
</svg>
